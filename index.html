<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulateur Rentabilité & Vacance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        input[type="range"] {
            accent-color: #3b82f6;
        }
        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans pb-10"
      x-data="simulateur()">

    <div class="bg-blue-900 text-white shadow-md sticky top-0 z-50 tap-highlight-transparent">
        <div class="p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">Analyse Financière</h1>
        </div>
        <div class="flex border-t border-blue-800">
            <button @click="tab = 'tresorerie'" 
                    :class="{'border-b-4 border-blue-400 bg-blue-800': tab === 'tresorerie'}"
                    class="flex-1 py-3 text-sm font-semibold transition-colors duration-200 uppercase tracking-wider">
                Trésorerie
            </button>
            <button @click="tab = 'vacance'" 
                    :class="{'border-b-4 border-blue-400 bg-blue-800': tab === 'vacance'}"
                    class="flex-1 py-3 text-sm font-semibold transition-colors duration-200 uppercase tracking-wider">
                Vacances
            </button>
        </div>
    </div>

    <div class="p-4 max-w-lg mx-auto">
        
        <div x-show="tab === 'tresorerie'" x-transition.opacity>
            
            <div class="bg-white rounded-2xl shadow-lg p-5 mb-6 border border-gray-100">
                <h2 class="text-gray-500 text-sm font-semibold uppercase mb-1">Cash-Flow Net Annuel</h2>
                <div class="text-3xl font-extrabold" :class="cashFlow >= 0 ? 'text-green-600' : 'text-red-500'" x-text="formatCurrency(cashFlow)"></div>
                
                <div class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-xs text-gray-500 uppercase">Point Mort (CA)</div>
                        <div class="font-bold text-gray-800" x-text="formatCurrency(pointMort)"></div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 uppercase">Mensualité Prêt</div>
                        <div class="font-bold text-gray-800" x-text="formatCurrency(mensualite)"></div>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prix d'acquisition (€)</label>
                    <input type="number" x-model.number="prix" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                </div>

                <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Apport (€)</label>
                        <input type="number" x-model.number="apport" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Emprunt (€)</label>
                        <div class="w-full bg-gray-100 border border-gray-200 rounded-lg p-3 text-lg text-gray-500 font-semibold" x-text="formatCurrency(emprunt)"></div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Taux (%)</label>
                        <input type="number" step="0.1" x-model.number="taux" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Durée (ans)</label>
                        <input type="number" x-model.number="duree" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
                    <label class="block text-sm font-medium text-gray-700 mb-1">CA Annuel Global (€)</label>
                    <input type="number" x-model.number="ca" class="w-full bg-green-50 border border-green-200 rounded-lg p-3 text-lg font-bold text-green-700 focus:ring-2 focus:ring-green-500 focus:border-green-500">
                </div>

                <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 border-l-4 border-l-red-400">
                    <h3 class="text-sm font-bold text-gray-800 uppercase tracking-wider mb-3">Détail des charges annuelles</h3>
                    
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-600 flex-1">Frais de gestion</label>
                            <input type="number" x-model.number="chargeGestion" class="w-1/2 bg-gray-50 border border-gray-200 rounded-md p-2 text-right focus:ring-1 focus:ring-red-400">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-60
