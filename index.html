<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Simulateur Rentabilité & Vacance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="range"] { accent-color: #3b82f6; }
        .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans pb-10">

    <div class="bg-blue-900 text-white shadow-md sticky top-0 z-50 tap-highlight-transparent">
        <div class="p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">Analyse Financière</h1>
        </div>
        <div class="flex border-t border-blue-800">
            <button onclick="switchTab('tresorerie')" id="btn-tresorerie" class="flex-1 py-3 text-sm font-semibold transition-colors duration-200 uppercase tracking-wider border-b-4 border-blue-400 bg-blue-800">Trésorerie</button>
            <button onclick="switchTab('vacance')" id="btn-vacance" class="flex-1 py-3 text-sm font-semibold transition-colors duration-200 uppercase tracking-wider border-b-4 border-transparent">Vacances</button>
        </div>
    </div>

    <div class="p-4 max-w-lg mx-auto">
        
        <div id="tab-tresorerie">
            
            <div class="bg-white rounded-2xl shadow-lg p-5 mb-6 border border-gray-100">
                <h2 class="text-gray-500 text-sm font-semibold uppercase mb-1">Cash-Flow Net Annuel</h2>
                <div id="out-cashflow" class="text-3xl font-extrabold text-green-600">0 €</div>
                
                <div class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-xs text-gray-500 uppercase">Point Mort (CA)</div>
                        <div id="out-pointmort" class="font-bold text-gray-800">0 €</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 uppercase">Mensualité Prêt</div>
                        <div id="out-mensualite" class="font-bold text-gray-800">0 €</div>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Prix d'acquisition (€)</label>
                        <input type="number" inputmode="numeric" id="in-prix" value="864000" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-lg font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    </div>
                    
                    <div class="col-span-2">
                        <div class="flex justify-between items-end mb-1">
                            <label class="block text-sm font-medium text-gray-700">Frais de notaire (Calcul légal)</label>
                        </div>
                        <div id="out-notaire" class="w-full bg-blue-50 border border-blue-200 rounded-lg p-3 text-lg font-bold text-blue-800">0 €</div>
                        <p id="notaire-detail" class="text-xs text-gray-500 mt-1"></p>
                    </div>

                    <div>
                        <label
